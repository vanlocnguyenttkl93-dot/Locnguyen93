<title>MU Local</title>
<style>
  :root { --bg:#0d0f14; --panel:#171b24; --line:#2c3444; --txt:#e6e9ef; --dim:#8b95a8; --gold:#f1c40f; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.4 system-ui,sans-serif; height:100%; overflow:hidden; }
  #wrap { position:relative; width:960px; max-width:100vw; margin:0 auto; }
  canvas { display:block; width:100%; height:auto; background:#000; touch-action:none; }
  #skillbar { display:flex; gap:6px; justify-content:center; padding:6px; flex-wrap:wrap; }
  .sk { position:relative; min-width:74px; padding:6px 8px; background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:6px; cursor:pointer; overflow:hidden; font-size:12px; }
  .sk b { color:var(--gold); }
  .sk .cd { position:absolute; left:0; bottom:0; width:100%; height:0; background:rgba(0,0,0,.6); pointer-events:none; }
  .sk.on { border-color:var(--gold); }
  #panel { position:absolute; top:8px; right:8px; width:330px; max-height:calc(100% - 90px); overflow:auto; background:rgba(23,27,36,.96); border:1px solid var(--line); border-radius:8px; display:none; }
  #tabs { display:flex; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); }
  #tabs button { flex:1; padding:8px 2px; background:none; border:0; color:var(--dim); cursor:pointer; }
  #tabs button.act { color:var(--gold); border-bottom:2px solid var(--gold); }
  #body { padding:10px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:4px 0; border-bottom:1px solid #222a38; }
  .row small { color:var(--dim); display:block; }
  button.b { background:#2a3347; color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:3px 8px; cursor:pointer; font-size:12px; }
  button.b:hover { border-color:var(--gold); }
  .exc { color:#2ecc71; } .gold { color:var(--gold); } .dim { color:var(--dim); }
  #overlay { position:absolute; inset:0; background:rgba(5,7,10,.92); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; }
  #overlay .cls { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  #overlay .cls button { width:200px; padding:14px; background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:8px; cursor:pointer; text-align:left; }
  #overlay .cls button:hover { border-color:var(--gold); }
  .ic { width:28px; height:28px; image-rendering:pixelated; margin-right:6px; flex:none; }
  .ic.xc { filter:drop-shadow(0 0 3px #2ecc71); }
  button.b:disabled { opacity:.4; cursor:not-allowed; }
  #help { color:var(--dim); font-size:12px; text-align:center; padding:0 8px 8px; }
</style>
</head>

function procIcon(fn) { const c = document.createElement('canvas'); c.width = c.height = 32; fn(c.getContext('2d')); return c; }
function makeProcedural() {

    for (const d of [-1, 1]) { g.beginPath(); g.moveTo(16, 20); g.quadraticCurveTo(16 + d * 6, 2, 16 + d * 15, 5); g.quadraticCurveTo(16 + d * 10, 10, 16 + d * 15, 13);

  SPR.ring = procIcon(g => { g.strokeStyle = '#f1c40f'; g.lineWidth = 4; g.beginPath(); g.arc(16, 20, 8, 0, 7); g.stroke();
    g.fillStyle = '#e74c3c'; g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.beginPath(); g.arc(16, 10, 4, 0, 7); g.fill(); g.stroke(); });
  const jewel = col => procIcon(g => { g.fillStyle = col; g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.beginPath();
    g.moveTo(16, 3); g.lineTo(27, 13); g.lineTo(16, 29); g.lineTo(5, 13); g.closePath(); g.fill(); g.stroke();

// ---------------------------------------------------------------- items
const effV = (v, lvl, exc) => v * (1 + 0.1 * lvl) * (exc ? 1.15 : 1);
function makeItem(slot, tier, cls) {
  tier = clamp(tier, 0, 11);
  const it = { id: uid(), slot, tier, lvl: 0, exc: Math.random() < 0.04 };
  if (slot === 'weapon') {
    const base = 4 + tier * 7;
    Object.assign(it, { name: ITEM_TABLES.weapon[cls][tier], cls, min: base, max: Math.round(base * 1.6) });
  } else if (slot === 'armor') {
    Object.assign(it, { name: ITEM_TABLES.armor[tier], def: 3 + tier * 5 });
  } else if (slot === 'wings') {
    Object.assign(it, { name: ITEM_TABLES.wings[tier], def: 8 + tier * 6, pct: 5 + tier * 3 });
  } else {
    Object.assign(it, { name: ITEM_TABLES.ring[tier], hp: 10 + tier * 15 });
  }
  return it;
}
const itemName = it => `${it.exc ? 'Excellent ' : ''}${it.name}${it.lvl ? ' +' + it.lvl : ''}`;
const itemValue = it => Math.round((it.tier + 1) * 40 * (1 + it.lvl * 0.5) * (it.exc ? 2 : 1));
function itemDesc(it) {
  const e = v => Math.round(effV(v, it.lvl, it.exc));
  if (it.slot === 'weapon') return `Dmg ${e(it.min)}-${e(it.max)}`;
  if (it.slot === 'armor') return `Def ${e(it.def)}`;
  if (it.slot === 'wings') return `Def ${e(it.def)}, Dmg +${Math.round(effV(it.pct, it.lvl, it.exc))}%`;
  return `HP +${e(it.hp)}`;
}
function randomDrop(monLvl, cls) {
  const tier = Math.min(11, Math.floor(monLvl / 5));
  const opts = ['weapon', 'armor', 'ring'];
  if (monLvl >= 8) opts.push('wings');
  const slot = opts[rint(0, opts.length - 1)];
  const wcls = Math.random() < 0.7 ? cls : Object.keys(CLASSES)[rint(0, 2)];
  const it = makeItem(slot, tier, wcls);
  const r = Math.random();
  it.lvl = r < 0.7 ? 0 : r < 0.9 ? 1 : r < 0.97 ? 2 : 3;
  return it;
}

function newPlayer(cls) {
  const c = CLASSES[cls];
  const p = { cls, level: 1, exp: 0, points: 0, zen: 300, stats: { ...c.base }, hp: 1, mp: 1,
    equip: { weapon: null, armor: null, wings: null, ring: null }, bag: [],
    map: 0, hpPot: 5, mpPot: 3, bless: 2, soul: 0, qi: 0, qa: false, qp: 0,
    x: TOWN.x, y: TOWN.y + 80, atkCd: 0, cds: [0, 0, 0], potCd: 0, buff: 0, buffPct: 0 };
  p.equip.weapon = makeItem('weapon', 0, cls); p.equip.weapon.exc = false;
  p.equip.armor = makeItem('armor', 0, cls); p.equip.armor.exc = false;
  const s = calc(p); p.hp = s.maxHp; p.mp = s.maxMp;
  return p;
}
function calc(p) {
  const c = CLASSES[p.cls], s = p.stats, w = p.equip.weapon, a = p.equip.armor, wg = p.equip.wings, r = p.equip.ring;
  const atk = s[c.atk];
  const wMin = w ? effV(w.min, w.lvl, w.exc) : 0, wMax = w ? effV(w.max, w.lvl, w.exc) : 0;
  const wing = wg ? effV(wg.pct, wg.lvl, wg.exc) / 100 : 0;
  return {
    min: atk / 4 + wMin + p.level * 0.5, max: atk / 2 + wMax + p.level * 0.8,
    dmgMul: (1 + wing) * (p.buff > 0 ? 1 + p.buffPct : 1),
    def: s.agi / 4 + (a ? effV(a.def, a.lvl, a.exc) : 0) + (wg ? effV(wg.def, wg.lvl, wg.exc) : 0),
    dodge: clamp(s.agi / 500, 0, 0.35),
    crit: 0.08 + (w && w.exc ? 0.07 : 0),
    maxHp: Math.round(60 + p.level * c.hpLvl + s.vit * c.hpVit + (r ? effV(r.hp, r.lvl, r.exc) : 0)),
    maxMp: Math.round(20 + p.level * c.mpLvl + s.ene * c.mpEne),
  };
}
const expNeed = lvl => Math.floor(80 * lvl * Math.pow(1.09, lvl));
function addExp(n) {
  P.exp += n;
  while (P.exp >= expNeed(P.level)) {
    P.exp -= expNeed(P.level); P.level++; P.points += 5;
    const s = calc(P); P.hp = s.maxHp; P.mp = s.maxMp;
    log(`Level up! Bạn đạt level ${P.level} (+5 điểm)`, '#f1c40f');
    fxRing(P.x, P.y, 80, '#f1c40f');

}

function dropLoot(m) {

// ---------------------------------------------------------------- combat
function hitMonster(m, raw, skillMul) {
  if (m.dead) return;
  const s = calc(P);
  let dmg = rnd(s.min, s.max) * (skillMul || 1) * s.dmgMul;
  const crit = Math.random() < s.crit; if (crit) dmg *= 1.5;
  dmg = Math.max(1, Math.round(dmg - m.t.def * 0.6));
  m.hp -= dmg; m.aggro = true;
  floatText(m.x, m.y - m.t.size - 6, (crit ? '!' : '') + dmg, crit ? '#f39c12' : '#fff', crit);
  if (m.hp <= 0) killMonster(m);
}
function hurtPlayer(m) {
  const s = calc(P);
  if (Math.random() < s.dodge) { floatText(P.x, P.y - 26, 'MISS', '#95a5a6'); return; }
  const dmg = Math.max(1, Math.round(rint(m.t.dmg[0], m.t.dmg[1]) - s.def * 0.5));
  P.hp -= dmg; floatText(P.x, P.y - 26, `-${dmg}`, '#e74c3c');

function die() {

}
function aimPoint() { return target && !target.dead ? target : { x: mouse.wx, y: mouse.wy }; }
function shoot(count, spread, speed, mul, pierce, color) {
  const a = aimPoint(), base = Math.atan2(a.y - P.y, a.x - P.x);
  for (let i = 0; i < count; i++) {
    const ang = count === 1 ? base : base - spread / 2 + spread * i / (count - 1);
    projectiles.push({ x: P.x, y: P.y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, mul, pierce, color, life: 0.9, hit: new Set() });

  const c = CLASSES[P.cls];

  P.atkCd = Math.max(0.3, c.atkCd - P.stats.agi / 2500);
  if (c.ranged) shoot(1, 0, 650, 1, false, P.cls === 'DW' ? '#5dade2' : '#d5f5e3');
  else if (target && !target.dead) { const t = target; fxRing(t.x, t.y, 26, '#fff'); hitMonster(t, 0, 1); }
}
function useSkill(i) {
  const c = CLASSES[P.cls], sk = c.skills[i];
  if (!sk || P.cds[i] > 0) return false;
  const s = calc(P);
  if (P.mp < sk.mana) { if (!autoMode) log('Không đủ mana', '#5dade2'); return false; }
  const live = target && !target.dead ? target : null;
  switch (sk.kind) {
    case 'aoe-self':
      fxRing(P.x, P.y, sk.radius, c.color);
      monsters.forEach(m => { if (!m.dead && dist(m, P) < sk.radius + m.t.size) hitMonster(m, 0, sk.mult); });
      break;
    case 'melee':
      if (!live || dist(live, P) > sk.range) { if (!autoMode) log('Cần mục tiêu trong tầm', '#aaa'); return false; }
      hitMonster(live, 0, sk.mult); fxRing(live.x, live.y, 40, c.color); break;
    case 'buff': P.buff = sk.dur; P.buffPct = sk.pct; fxRing(P.x, P.y, 60, '#e67e22'); log(`${sk.name}: +${sk.pct * 100}% sát thương`, '#e67e22'); break;

// ---------------------------------------------------------------- update
function nearestMonster(maxD) {

}

function updateMonsters(dt) {

  fx.forEach(f => f.t -= dt); fx = fx.filter(f => f.t > 0);

function refresh() { if (panelOpen) renderTab(); }
function bagRemove(id) { const i = P.bag.findIndex(x => x.id === id); return i >= 0 ? P.bag.splice(i, 1)[0] : null; }
function findItem(id) { return P.bag.find(x => x.id === id) || SLOTS.map(s => P.equip[s]).find(x => x && x.id === id); }
function equip(id) {
  const it = P.bag.find(x => x.id === id); if (!it) return;
  if (it.cls && it.cls !== P.cls) { log(`Vũ khí này chỉ dành cho ${CLASSES[it.cls].name}`, '#e74c3c'); return; }
  bagRemove(id); const old = P.equip[it.slot]; P.equip[it.slot] = it; if (old) P.bag.push(old);
  const s = calc(P); P.hp = Math.min(P.hp, s.maxHp);
}
function upgrade(id) {
  const it = findItem(id); if (!it) return;
  if (it.lvl >= MAX_ITEM_LVL) { log('Item đã đạt +13', '#aaa'); return; }
  if (it.lvl < 6) {
    if (P.bless < 1) { log('Cần Jewel of Bless', '#e74c3c'); return; }
    P.bless--; it.lvl++; log(`${itemName(it)} nâng cấp thành công!`, '#2ecc71'); fxRing(P.x, P.y, 50, '#5dade2');
  } else {
    if (P.soul < 1) { log('Cần Jewel of Soul', '#e74c3c'); return; }
    P.soul--; const rate = Math.max(0.15, 0.65 - (it.lvl - 6) * 0.08);
    if (Math.random() < rate) { it.lvl++; log(`${itemName(it)} nâng cấp thành công! (${Math.round(rate * 100)}%)`, '#2ecc71'); fxRing(P.x, P.y, 50, '#f39c12'); }
    else { const drop = it.lvl >= 9; if (drop) it.lvl--; log(`Nâng cấp thất bại (${Math.round(rate * 100)}%)${drop ? ' — item tụt cấp' : ''}`, '#e74c3c'); }
  }
  refresh();
}
$('panel').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab) { tab = b.dataset.tab; renderTab(); return; }
  const a = b.dataset.act, d = b.dataset;
  if (a === 'stat') { const n = Math.min(+d.n, P.points); P.stats[d.k] += n; P.points -= n; }
  else if (a === 'equip') equip(+d.id);
  else if (a === 'unequip') { if (P.bag.length < MAX_BAG) { P.bag.push(P.equip[d.s]); P.equip[d.s] = null; } else log('Túi đồ đầy!', '#e74c3c'); }
  else if (a === 'sell') { const it = bagRemove(+d.id); if (it) P.zen += Math.round(itemValue(it) * 0.4); }
  else if (a === 'upg') { upgrade(+d.id); return; }
  else if (a === 'qaccept') { P.qa = true; P.qp = 0; }
  else if (a === 'qclaim') { const q = QUESTS[P.qi]; addExp(q.exp); P.zen += q.zen; P.qi++; P.qa = false; P.qp = 0; log(`Nhận thưởng quest: ${q.exp} EXP, ${q.zen} zen`, '#e67e22'); }
  else if (a === 'buy') { if (!nearNpc('shop')) return log('Lại gần Merchant!', '#aaa'); const p = +d.p; if (P.zen >= p) { P.zen -= p; P[d.k]++; } else log('Không đủ zen', '#e74c3c'); }
  else if (a === 'buygear') { if (!nearNpc('shop')) return log('Lại gần Merchant!', '#aaa'); const it = shopGear[+d.i], p = itemValue(it) * 2;
    if (P.bag.length >= MAX_BAG) log('Túi đồ đầy!', '#e74c3c'); else if (P.zen < p) log('Không đủ zen', '#e74c3c'); else { P.zen -= p; P.bag.push({ ...it, id: uid() }); } }
  else if (a === 'warp') { if (!nearNpc('warp')) return log('Lại gần Gatekeeper!', '#aaa'); const m = MAPS[+d.id], cost = m.id * m.id * 100;
    if (P.level < m.req) log(`Cần level ${m.req}`, '#e74c3c'); else if (P.zen < cost) log('Không đủ zen', '#e74c3c');
    else { P.zen -= cost; loadMap(m.id); closePanel(); log(`Đã dịch chuyển đến ${m.name}`, '#5dade2'); return; } }
  else if (a === 'reset') { if (confirm('Xóa toàn bộ tiến trình?')) { try { localStorage.removeItem(SAVE_KEY); } catch (_) {} location.reload(); } return; }
  renderTab();
});
const nearNpc = id => NPCS.some(n => n.id === id && dist(n, P) < 160);

// ---------------------------------------------------------------- skillbar
function syncSkillbar() {
  const c = CLASSES[P.cls];
  $('skillbar').innerHTML = c.skills.map((s, i) => `<button class="sk" data-sk="${i}"><b>${i + 1}</b> ${s.name}<br><small>${s.mana} MP</small><div class="cd" id="cd${i}"></div></button>`).join('')
    + `<button class="sk" data-pot="hp"><b>Q</b> HP Pot</button><button class="sk" data-pot="mp"><b>E</b> MP Pot</button><button class="sk ${autoMode ? 'on' : ''}" id="autoBtn"><b>F</b> Auto</button>`;
}
$('skillbar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !P) return;
  if (b.dataset.sk) useSkill(+b.dataset.sk); else if (b.dataset.pot) usePotion(b.dataset.pot); else toggleAuto();
});
function toggleAuto() { autoMode = !autoMode; if (!autoMode) target = null; const b = $('autoBtn'); if (b) b.classList.toggle('on', autoMode); }

// ---------------------------------------------------------------- input
function toWorld(e) {
  const r = canvas.getBoundingClientRect(); mouse.x = (e.clientX - r.left) * W / r.width; mouse.y = (e.clientY - r.top) * H / r.height;
  mouse.wx = mouse.x + cam.x; mouse.wy = mouse.y + cam.y;
}
canvas.addEventListener('pointermove', toWorld);
canvas.addEventListener('pointerdown', e => {
  if (!P) return; toWorld(e);
  const w = { x: mouse.wx, y: mouse.wy };
  const npc = NPCS.find(n => Math.abs(n.x - w.x) < 20 && Math.abs(n.y - w.y) < 20);
  if (npc) { if (dist(npc, P) < 160) openPanel(npc.id); else { log('Lại gần NPC hơn', '#aaa'); dest = { x: npc.x, y: npc.y + 40 }; } return; }
  const m = monsters.find(m => !m.dead && dist(m, w) < m.t.size + 8);
  if (m && !inTown(m)) { target = m; dest = null; return; }
  target = null; dest = w; autoMode && toggleAuto();
});
addEventListener('keydown', e => {
  if (!P) return; const k = e.key.toLowerCase();
  if ('wasd'.includes(k) && k.length === 1) keys[k] = true;
  if (k === '1' || k === '2' || k === '3') useSkill(+k - 1);
  else if (k === 'q') usePotion('hp'); else if (k === 'e') usePotion('mp');
  else if (k === 'f') toggleAuto();
  else if (k === 'c') panelOpen && tab === 'char' ? closePanel() : openPanel('char');
  else if (k === 'i') panelOpen && tab === 'bag' ? closePanel() : openPanel('bag');
  else if (k === 'j') panelOpen && tab === 'quest' ? closePanel() : openPanel('quest');
  else if (k === 'escape') closePanel();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// ---------------------------------------------------------------- save / boot
function save() {
  lastSave = performance.now(); if (!P) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(P)); } catch (_) {}
}
addEventListener('beforeunload', save);
function loadSave() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (_) { return null; } }
function makeShopGear() { shopGear = [makeItem('weapon', 1, P.cls), makeItem('weapon', 2, P.cls), makeItem('armor', 1, P.cls), makeItem('armor', 2, P.cls)].map(i => (i.exc = false, i)); }
function start(p) {
  P = p; P.cds = [0, 0, 0]; P.atkCd = 0; P.potCd = 0; P.buff = 0;
  $('overlay').style.display = 'none';
  loadMap(P.map || 0, true); makeShopGear(); syncSkillbar();
  log(`Chào mừng ${CLASSES[P.cls].name}! Ra ngoài thị trấn để săn quái. Nhận quest ở Quest Master.`, '#5dade2');
  window.MU = { get P() { return P; }, get monsters() { return monsters; }, calc, useSkill, spawnMonster, loadMap, MAPS };
  let last = performance.now();
  (function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    updatePlayer(dt); updateMonsters(dt); updateProjectiles(dt); updateMisc(dt);
    P.cds.forEach((v, i) => { const el = $('cd' + i), max = CLASSES[P.cls].skills[i].cd; if (el) el.style.height = (v > 0 ? clamp(v / max, 0, 1) * 100 : 0) + '%'; });
    draw(); requestAnimationFrame(loop);
  })(last);
}
function menu() {
  const saved = loadSave();
  $('overlay').innerHTML = `<h1>MU Local</h1><p class="dim">Game ARPG offline lấy cảm hứng từ MU Online — chọn class để bắt đầu</p>
    <div class="cls">${Object.entries(CLASSES).map(([k, c]) => `<button data-cls="${k}"><b style="color:${c.color}">${c.name}</b><br><small class="dim">STR ${c.base.str} · AGI ${c.base.agi} · VIT ${c.base.vit} · ENE ${c.base.ene}</small><br><small>${c.desc}</small></button>`).join('')}</div>
    ${saved ? `<button class="b" id="cont">Tiếp tục: ${CLASSES[saved.cls].name} Lv ${saved.level}</button>` : ''}`;
  $('overlay').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.cls) start(newPlayer(b.dataset.cls)); else if (b.id === 'cont') start(saved);
  };
}
initSprites(menu);
})();

</script>
